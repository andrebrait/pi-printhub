<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Scan – Print Hub</title>
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/vendor/cropper/cropper.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<header id="shell"></header>
<main class="container-lg pb-4">
  <h1 id="heading" class="h3 mb-3 text-break">New scan</h1>
  <p id="load-error" class="alert alert-danger error" role="alert" hidden></p>

  <div class="row g-3">
    <div class="col-lg-8 min-w-0">
      <button id="edit-toggle" class="btn btn-outline-primary mb-3" type="button" hidden>Edit or add pages</button>
      <form id="scan-form" class="card mb-3" hidden>
        <div class="card-body d-grid gap-3">
          <p id="scanner-status" class="mb-0" role="status">Looking for the scanner…</p>
          <button id="scanner-retry" class="btn btn-outline-secondary justify-self-start" type="button" hidden>Retry</button>
          <div id="settings" class="row g-3" hidden>
            <div class="col-sm-4">
              <label class="form-label" for="resolution">Resolution</label>
              <select id="resolution" class="form-select"></select>
            </div>
            <div class="col-sm-4">
              <label class="form-label" for="mode">Color</label>
              <select id="mode" class="form-select"></select>
            </div>
            <div class="col-sm-4">
              <label class="form-label" for="area">Area</label>
              <select id="area" class="form-select">
                <option value="a4">A4</option>
                <option value="letter">Letter</option>
                <option value="full">Whole glass</option>
              </select>
            </div>
          </div>
          <div class="d-flex flex-wrap gap-2">
            <button id="scan-flatbed" class="btn btn-primary" type="button" hidden>Scan from glass</button>
            <button id="scan-adf" class="btn btn-primary" type="button" hidden>Scan from feeder</button>
          </div>
          <p id="scan-status" class="mb-0" role="status"></p>
          <div id="scan-failed" class="alert alert-danger d-flex flex-wrap align-items-center gap-2 mb-0" hidden>
            <p id="scan-error" class="error mb-0 me-auto" role="alert"></p>
            <button id="retry" class="btn btn-sm btn-outline-danger" type="button">Retry</button>
          </div>
        </div>
      </form>
      <p id="edit-error" class="alert alert-danger error" role="alert" hidden></p>
      <ul id="pages" class="pages" aria-label="Pages"></ul>
    </div>

    <section id="export" class="col-lg-4" aria-labelledby="export-heading" hidden>
      <div class="card sticky-side">
        <div class="card-body d-grid gap-3">
          <h2 id="export-heading" class="h5 mb-0">Save and send</h2>
          <div>
            <label class="form-label" for="title">Title</label>
            <input id="title" class="form-control" type="text" required autocomplete="off">
          </div>
          <div id="outputs" class="d-grid gap-3">
            <div class="d-flex flex-wrap gap-2">
              <a id="download-pdf" class="btn btn-outline-secondary">Download PDF</a>
              <a id="download-jpeg" class="btn btn-outline-secondary">Download JPEG</a>
              <a id="print" class="btn btn-outline-primary">Print</a>
            </div>
            <form id="email" class="d-grid gap-3 border-top pt-3">
              <div>
                <label class="form-label" for="to">Email to</label>
                <input id="to" class="form-control" type="email" multiple list="recipients" autocomplete="email" placeholder="name@example.com">
                <datalist id="recipients"></datalist>
              </div>
              <div>
                <label class="form-label" for="subject">Subject</label>
                <input id="subject" class="form-control" type="text">
              </div>
              <fieldset>
                <legend class="form-label fs-6">Attach as</legend>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="format" id="format-pdf" value="pdf" checked>
                  <label class="form-check-label" for="format-pdf">PDF</label>
                </div>
                <div class="form-check form-check-inline">
                  <input class="form-check-input" type="radio" name="format" id="format-jpeg" value="jpeg">
                  <label class="form-check-label" for="format-jpeg">JPEG</label>
                </div>
              </fieldset>
              <button id="send" class="btn btn-primary" type="submit">Send email</button>
              <p id="email-status" class="mb-0" role="status"></p>
            </form>
          </div>
        </div>
      </div>
    </section>
  </div>

  <dialog id="crop-dialog" class="crop-dialog" aria-labelledby="crop-heading">
    <h2 id="crop-heading" class="h5">Crop page</h2>
    <div class="mb-3" style="max-width: 14rem">
      <label class="form-label" for="aspect">Shape</label>
      <select id="aspect" class="form-select">
        <option value="">Free</option>
        <option value="a4">A4</option>
        <option value="letter">Letter</option>
      </select>
    </div>
    <div class="crop-stage"><img id="crop-image" alt="Page to crop"></div>
    <div class="d-flex gap-2">
      <button id="crop-apply" class="btn btn-primary" type="button">Apply</button>
      <button id="crop-cancel" class="btn btn-outline-secondary" type="button">Cancel</button>
    </div>
  </dialog>
</main>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/shell.js"></script>
<script src="/vendor/sortable/Sortable.min.js"></script>
<script src="/vendor/cropper/cropper.min.js"></script>
<script type="module" src="/js/scan.js"></script>
<script type="module" src="/js/sw-register.js"></script>
</body>
</html>
