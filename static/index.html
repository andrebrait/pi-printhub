<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Print Hub</title>
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<header id="shell"></header>
<main>
  <header class="bar">
    <h1>Print Hub</h1>
    <button id="logout" type="button">Log out</button>
  </header>

  <section class="actions" aria-labelledby="print-heading">
    <h2 id="print-heading" class="visually-hidden">Start</h2>
    <label class="drop" id="drop">
      <strong>Print a file</strong><br>
      Drop a file here or tap to choose one
      <input id="file" class="visually-hidden" type="file">
    </label>
    <progress id="progress" max="1" value="0" aria-label="Upload progress" hidden></progress>
    <p id="upload-status" role="status"></p>
    <a class="button primary" href="/scan.html">New scan</a>
  </section>

  <section aria-labelledby="recent-prints">
    <h2 id="recent-prints">Recent prints</h2>
    <ul id="prints" class="docs"></ul>
  </section>
  <section aria-labelledby="recent-scans">
    <h2 id="recent-scans">Recent scans</h2>
    <ul id="scans" class="docs"></ul>
  </section>
</main>

<script type="module">
// SPDX-License-Identifier: AGPL-3.0-only
import { apiFetch, errorMessage, uploadFile } from "/js/api.js";

const $ = (id) => document.getElementById(id);


function fill(list, docs, page) {
  list.replaceChildren();
  if (!docs.length) {
    const li = document.createElement("li");
    li.textContent = "Nothing yet";
    list.append(li);
  }
  for (const d of docs.slice(0, 10)) {
    const li = document.createElement("li");
    const a = document.createElement("a");
    a.href = `/${page}.html?doc=${encodeURIComponent(d.id)}`;
    const title = document.createElement("span");
    title.textContent = d.title;
    const meta = document.createElement("span");
    meta.className = "meta";
    const when = new Date(d.modified).toLocaleString(undefined, { dateStyle: "medium", timeStyle: "short" });
    meta.textContent = `${d.page_count} page${d.page_count === 1 ? "" : "s"} · ${when}`;
    a.append(title, meta);
    li.append(a);
    list.append(li);
  }
}

async function refreshDocs() {
  const res = await apiFetch("/api/docs");
  if (!res.ok) return;
  const docs = await res.json();
  fill($("prints"), docs.filter((d) => d.kind === "print"), "print");
  fill($("scans"), docs.filter((d) => d.kind === "scan"), "scan");
}

async function upload(file) {
  const status = $("upload-status"), bar = $("progress");
  status.className = "";
  status.textContent = `Uploading ${file.name}…`;
  bar.value = 0;
  bar.hidden = false;
  try {
    const { status: code, body } = await uploadFile(file, (f) => {
      bar.value = f;
      if (f === 1) status.textContent = "Converting…";
    });
    if (code === 200) {
      location.href = `/print.html?doc=${encodeURIComponent(body.doc_id)}`;
      return;
    }
    const message = body?.error ?? `Upload failed (${code})`;
    if (code === 422 && body?.doc_id) {
      // The document was kept; the print page offers Retry.
      location.href = `/print.html?doc=${encodeURIComponent(body.doc_id)}&error=${encodeURIComponent(message)}`;
      return;
    }
    status.className = "error";
    status.textContent = message;
  } catch (e) {
    status.className = "error";
    status.textContent = e.message;
  }
  bar.hidden = true;
}

$("file").addEventListener("change", (e) => {
  const [file] = e.target.files;
  e.target.value = ""; // lets the same file be picked again after a failure
  if (file) upload(file);
});
const drop = $("drop");
drop.addEventListener("dragover", (e) => {
  e.preventDefault();
  drop.classList.add("over");
});
drop.addEventListener("dragleave", () => drop.classList.remove("over"));
drop.addEventListener("drop", (e) => {
  e.preventDefault();
  drop.classList.remove("over");
  if (e.dataTransfer.files[0]) upload(e.dataTransfer.files[0]);
});
$("logout").addEventListener("click", async () => {
  await apiFetch("/api/logout", { method: "POST" });
  location.href = "/login.html";
});

refreshDocs();
</script>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/shell.js"></script>
<script type="module" src="/js/sw-register.js"></script>
</body>
</html>
