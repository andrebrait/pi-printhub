<!doctype html>
<!-- SPDX-License-Identifier: AGPL-3.0-only -->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Log in – Print Hub</title>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
<main>
  <header class="bar"><h1>Print Hub</h1></header>
  <form id="form" class="stack">
    <label>Password
      <input id="password" type="password" autocomplete="current-password" required autofocus>
    </label>
    <button class="primary" type="submit">Log in</button>
    <p id="status" class="error" role="alert"></p>
    <a id="continue" href="/" hidden>Continue without the shared file</a>
  </form>
</main>

<script type="module">
// SPDX-License-Identifier: AGPL-3.0-only
const params = new URLSearchParams(location.search);
const share = params.get("share");
const next = params.get("next");
// Only same-site paths: "//host" and "/\host" would leave the site.
const dest = next && /^\/(?![/\\])/.test(next) ? next : "/";
const status = document.getElementById("status");
const fail = async (res) => {
  status.textContent = (await res.json().catch(() => null))?.error ?? `${res.status} ${res.statusText}`;
};
const post = (path, body) =>
  fetch(path, {
    method: "POST",
    headers: body && { "Content-Type": "application/json" },
    body: body && JSON.stringify(body),
  });

document.getElementById("form").addEventListener("submit", async (e) => {
  e.preventDefault();
  status.textContent = "";
  try {
    const login = await post("/api/login", { password: document.getElementById("password").value });
    if (!login.ok) return await fail(login);
    if (!share) return void (location.href = dest);
    const claim = await post(`/api/share/${encodeURIComponent(share)}/claim`);
    const body = await claim.json().catch(() => null);
    if (claim.ok) return void (location.href = `/print.html?doc=${encodeURIComponent(body.doc_id)}`);
    if (claim.status === 422 && body?.doc_id) {
      return void (location.href = `/print.html?doc=${encodeURIComponent(body.doc_id)}&error=${encodeURIComponent(body.error)}`);
    }
    status.textContent = body?.error ?? `${claim.status} ${claim.statusText}`;
    const cont = document.getElementById("continue");
    cont.href = dest;
    cont.hidden = false;
  } catch (err) {
    status.textContent = err.message;
  }
});
</script>
</body>
</html>
