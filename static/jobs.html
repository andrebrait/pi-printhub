<!doctype html>

<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jobs – Print Hub</title>
  <link rel="stylesheet" href="/vendor/bootstrap/bootstrap.min.css">
  <link rel="stylesheet" href="/css/app.css">
  <link rel="manifest" href="/manifest.webmanifest">
</head>
<body>
<header id="shell"></header>
<main class="container-lg pb-4">
  <h1 class="h3 mb-3">Jobs</h1>
  <div id="jobs-error" class="alert alert-danger d-flex align-items-center gap-2" role="alert" hidden></div>
  <p id="jobs-loading" class="text-body-secondary">Loading jobs…</p>

  <section class="mb-4" aria-labelledby="active-heading">
    <h2 id="active-heading" class="h5">Printing and waiting</h2>
    <ul id="active-jobs" class="list-group"></ul>
    <p id="no-active" class="text-body-secondary" hidden>Nothing is printing.</p>
  </section>

  <section aria-labelledby="recent-heading">
    <h2 id="recent-heading" class="h5">Recently finished</h2>
    <ul id="recent-jobs" class="list-group"></ul>
    <p id="no-recent" class="text-body-secondary" hidden>No finished jobs yet.</p>
  </section>
  <button id="jobs-retry" class="btn btn-outline-secondary mt-3" type="button">Refresh</button>
</main>
<script src="/vendor/bootstrap/bootstrap.bundle.min.js"></script>
<script type="module" src="/js/shell.js"></script>
<script type="module" src="/js/jobs.js"></script>
<script type="module" src="/js/sw-register.js"></script>
</body>
</html>
